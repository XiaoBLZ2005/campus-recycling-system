[platformio]
default_envs = display_diag

[env:display_diag]
platform = espressif32@8.0.0
framework = arduino
board = esp32-8048S070C
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 115200

lib_deps =
  lvgl/lvgl@9.2.2

build_flags =
  -DLV_CONF_SKIP
  '-DLV_CONF_KCONFIG_EXTERNAL_INCLUDE="sdkconfig.h"'
  -DCORE_DEBUG_LEVEL=3
  -DLV_FONT_MONTSERRAT_24=1
  -DLV_FONT_MONTSERRAT_32=1
  -DLV_FONT_MONTSERRAT_48=1
  -DLV_FONT_SIMSUN_16_CJK=1
  -UBOARD_HAS_TOUCH
  -DDISPLAY_BCKL=GPIO_BCKL
  -DGT911_I2C_CONFIG_SDA=GT911_I2C_CONFIG_SDA_IO_NUM
  -DGT911_I2C_CONFIG_SCL=GT911_I2C_CONFIG_SCL_IO_NUM
  -DGT911_TOUCH_CONFIG_RST=GT911_TOUCH_CONFIG_RST_GPIO_NUM
  -DGT911_TOUCH_CONFIG_INT=GT911_TOUCH_CONFIG_INT_GPIO_NUM
